services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rental_manager
      POSTGRES_USER: rental_manager
      POSTGRES_PASSWORD: demo-only-change-me
    volumes:
      - demo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental_manager"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports: ["4000:4000"]
    environment:
      # Démonstration locale uniquement : une production réelle doit utiliser HTTPS.
      NODE_ENV: development
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:4000
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://rental_manager:demo-only-change-me@db:5432/rental_manager
      SETUP_TOKEN: replace-with-at-least-24-random-characters
      DATA_DIR: /app/data
    command: ["sh", "-c", "npm run prod:migrate && npm run start"]
    volumes:
      - demo-files:/app/data
volumes:
  demo-db:
  demo-files:
