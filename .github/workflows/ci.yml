name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The server test suite records generated-document usage through Prisma.
      # Keep that state in an isolated SQLite database for each CI run.
      DATABASE_URL: file:./server/prisma/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --include=optional
      - name: Install Chromium for PDF tests
        run: npx playwright install --with-deps chromium
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run prisma -w server -- migrate deploy
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
